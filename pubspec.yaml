name: flow_md_editor
description: Local-first Markdown editor for macOS (FlowMD-style live preview).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  markdown: ^7.3.0
  flutter_markdown: ^0.7.7+1
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  shared_preferences: ^2.5.3
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  url_launcher: ^6.3.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
